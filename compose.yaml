services:
  web:
    build: ./frontend
    ports:
      - "8080:8080"
    depends_on:
      - api
  api:
    build: ./backend
    environment: &backend-env
      DATABASE_URL: postgresql://foxelli:foxelli@postgres:5432/foxelli
      REDIS_URL: redis://redis:6379/0
      VIDEO_DIR: /data/videos
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./.local-videos:/data/videos
  worker:
    build: ./backend
    command: rq worker foxelli --url redis://redis:6379/0
    environment: *backend-env
    volumes:
      - ./.local-videos:/data/videos
    depends_on:
      api:
        condition: service_started
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: foxelli
      POSTGRES_PASSWORD: foxelli
      POSTGRES_DB: foxelli
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foxelli"]
      interval: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 20
volumes:
  postgres-data:
