server {
    listen 80;
    server_name 5.22.217.149;
    root /var/www/foxelli;
    location /.well-known/acme-challenge/ { try_files $uri =404; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name 5.22.217.149;
    root /opt/foxelli/current/web;
    index index.html;
    client_max_body_size 251m;
    ssl_certificate /etc/letsencrypt/live/5.22.217.149/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/5.22.217.149/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    auth_basic "Foxelli Review";
    auth_basic_user_file /etc/nginx/foxelli.htpasswd;

    location = / { return 302 /foxelli-test/; }
    location = /foxelli-test { return 301 /foxelli-test/; }

    location ^~ /foxelli-test/api/ {
        rewrite ^/foxelli-test(/api/.*)$ $1 break;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location = /foxelli-test/ {
        try_files /index.html =404;
    }

    location ^~ /foxelli-test/ {
        rewrite ^/foxelli-test/(.*)$ /$1 break;
        try_files $uri =404;
    }

    location / { return 404; }
}
